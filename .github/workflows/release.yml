name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: gz-linux-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: gz-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: gz-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: gz-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage asset + checksum
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.asset }}" == *.exe ]]; then bin="gz.exe"; else bin="gz"; fi
          cp "target/${{ matrix.target }}/release/$bin" "dist/${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

  # A release becomes "latest" the moment it is published, and the installers
  # and `gz update` download from "latest". So it is published once, with
  # every platform's file already attached; publishing per platform left it
  # missing files for minutes. A failed build publishes nothing.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach every file to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
            install.sh
            install.ps1
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
